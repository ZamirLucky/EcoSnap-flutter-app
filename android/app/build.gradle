plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Add the Google services Gradle plugin
    id 'com.google.gms.google-services'
}

android {
    namespace = "com.example.ecosnap"
    compileSdkVersion 35
    // You can remove the following line if you explicitly set compileSdkVersion above.
    // compileSdk = flutter.compileSdkVersion 
    //ndkVersion = flutter.ndkVersion
    ndkVersion = "25.1.8937393"
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8 //JavaVersion.VERSION_17 
        targetCompatibility = JavaVersion.VERSION_1_8 //JavaVersion.VERSION_17 //
        //compilerArgs += ["-Xlint:-options"] // Suppress warnings about options
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8 //JavaVersion.VERSION_17 
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.ecosnap"
        minSdkVersion 23
        targetSdkVersion 35
        // minSdk = flutter.targetSdkVersion
        // targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Pass the debug token from the CI environment variable.
        testInstrumentationRunnerArguments["firebaseAppCheckDebugSecret"] = 
            System.getenv("APP_CHECK_DEBUG_TOKEN_FROM_CI") ?: ""
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    
}

flutter {
    source = "../.."
}
